x-php-common: &php_common
  volumes:
    - .gitconfig:/root/.gitconfig
    - .:/srv/www:delegated
  environment:
    COMPOSER_MEMORY_LIMIT: -1

x-php-build: &php_build
  context: ./
  dockerfile: ./docker/php/Dockerfile

services:
  generics-php8.5:
    <<: *php_common
    container_name: generics-php8.5
    build:
      <<: *php_build
      args:
        PHP_VERSION: 8.5

  generics-php-min:
    extends:
      service: generics-php8.5
    container_name: generics-php-min
